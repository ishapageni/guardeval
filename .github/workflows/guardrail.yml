name: GuardEval Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  guardrail-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run security regression tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run 40-sample security quality gate
        env:
          PYTHONPATH: .
        run: python -m evaluation.check_thresholds
